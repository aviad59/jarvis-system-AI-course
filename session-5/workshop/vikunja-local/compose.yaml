services: # מגדירים את היישום המקומי של התרגיל
  vikunja: # כל סטודנט מפעיל עותק נפרד על המחשב שלו
    image: vikunja/vikunja:2.7.1 # מקבעים גרסה שתומכת בחיבור MCP
    ports: # מאפשרים גישה רק מאותו מחשב
      - "127.0.0.1:3456:3456" # הדפדפן מתחבר ליציאה המקומית
    environment: # מוסרים ליישום את הגדרות ההפעלה
      VIKUNJA_SERVICE_PUBLICURL: "http://localhost:3456/" # כתובת היישום בדפדפן המקומי
      VIKUNJA_DATABASE_TYPE: "sqlite" # משתמשים במסד הכלול ביישום
      VIKUNJA_DATABASE_PATH: "/db/vikunja.db" # קובץ הנתונים נמצא בתיקייה המחוברת למחשב
    volumes: # שומרים נתונים מחוץ למחזור החיים של הקונטיינר
      - "./data/db:/db" # מסד הנתונים נשמר בתיקייה המקומית data/db
      - "./data/files:/app/vikunja/files" # קבצים מצורפים נשמרים בנפרד בתיקייה המקומית
